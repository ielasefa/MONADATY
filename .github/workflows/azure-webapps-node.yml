name: Build and deploy Node.js app to Azure Web App - monadaty-ilyas

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: "22.x"
  AZURE_WEBAPP_NAME: "monadaty-ilyas"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Verify required build secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          echo "DATABASE_URL length: ${#DATABASE_URL}"
          echo "SESSION_SECRET length: ${#SESSION_SECRET}"

          test -n "$DATABASE_URL" || (echo "DATABASE_URL is EMPTY" && exit 1)
          test -n "$SESSION_SECRET" || (echo "SESSION_SECRET is EMPTY" && exit 1)
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || (echo "NEXT_PUBLIC_SUPABASE_URL is EMPTY" && exit 1)
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || (echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY is EMPTY" && exit 1)

          if [ ${#SESSION_SECRET} -lt 32 ]; then
            echo "SESSION_SECRET is too short"
            exit 1
          fi

          echo "Required build secrets are available"

      - name: Install dependencies, build and test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm ci
          npm run build
          npm run test --if-present

      - name: Verify production build
        run: |
          test -f package.json
          test -d .next
          test -d node_modules
          test -f node_modules/.bin/next

          echo "Production build files are ready"

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .next
            public
            node_modules
            generated
            package.json
            package-lock.json
            next.config.js

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download production artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: Verify deployment package
        run: |
          echo "Deployment package contents:"
          ls -la

          test -f package.json || (echo "package.json missing" && exit 1)
          test -d .next || (echo ".next missing" && exit 1)
          test -d node_modules || (echo "node_modules missing" && exit 1)
          test -f node_modules/.bin/next || (echo "next binary missing" && exit 1)

          echo "Deployment package is valid"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_EDE91C85784246F0B7EC08FBE9E4383A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0EFD8B8BDF5C478C919156C9993FB4F7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_512A21CFD02A4B24A323A0028DCEFF84 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: .