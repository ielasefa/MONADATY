name: Build and deploy MONADATY to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      apply_admin_delete_migration:
        description: "Back up production, apply the admin deletion migration, then deploy this release"
        required: true
        type: boolean
        default: false

env:
  NODE_VERSION: "22.x"
  AZURE_WEBAPP_NAME: "monadaty-ilyas"
  NEXT_TELEMETRY_DISABLED: "1"
  DEPLOYMENT_VERSION: ${{ github.sha }}
  UPLOAD_ROOT: "/home/data/monadaty/uploads"
  INVOICE_ROOT: "/home/data/monadaty/invoices"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Verify required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_CA_CERT_BASE64: ${{ secrets.DATABASE_CA_CERT_BASE64 }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
        run: |
          test -n "$DATABASE_URL" || {
            echo "::error::DATABASE_URL is missing"
            exit 1
          }

          test -n "$SESSION_SECRET" || {
            echo "::error::SESSION_SECRET is missing"
            exit 1
          }

          test -n "$DATABASE_CA_CERT_BASE64" || {
            echo "::error::DATABASE_CA_CERT_BASE64 is missing"
            exit 1
          }

          test -n "$APP_URL" || {
            echo "::error::APP_URL repository variable is missing"
            exit 1
          }

          test -n "$ALLOWED_ORIGINS" || {
            echo "::error::ALLOWED_ORIGINS repository variable is missing"
            exit 1
          }

          test "$APP_URL" = "https://monadaty.com" || {
            echo "::error::APP_URL must be https://monadaty.com"
            exit 1
          }

          test "$ALLOWED_ORIGINS" = "https://monadaty.com,https://www.monadaty.com" || {
            echo "::error::ALLOWED_ORIGINS must contain the two canonical production origins"
            exit 1
          }

          test "$UPLOAD_ROOT" = "/home/data/monadaty/uploads" || {
            echo "::error::UPLOAD_ROOT must use Azure persistent storage"
            exit 1
          }

          test "$INVOICE_ROOT" = "/home/data/monadaty/invoices" || {
            echo "::error::INVOICE_ROOT must use Azure persistent storage"
            exit 1
          }

          if [ ${#SESSION_SECRET} -lt 32 ]; then
            echo "::error::SESSION_SECRET must contain at least 32 characters"
            exit 1
          fi

      - name: Install dependencies
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build application
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_CA_CERT_BASE64: ${{ secrets.DATABASE_CA_CERT_BASE64 }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
        run: npm run build

      - name: Prepare standalone deployment
        run: |
          rm -rf deploy
          mkdir -p deploy/.next

          cp -a .next/standalone/. deploy/

          cp -a .next/static deploy/.next/static

          if [ -d public ]; then
            rm -rf deploy/public
            cp -a public deploy/public
          fi

          if [ -d generated ]; then
            rm -rf deploy/generated
            cp -a generated deploy/generated
          fi

          rm -f deploy/.env
          rm -f deploy/.env.local
          rm -f deploy/.env.production
          rm -f deploy/.env.production.local

          test -f deploy/server.js || {
            echo "::error::server.js missing"
            exit 1
          }

          test -f deploy/package.json || {
            echo "::error::package.json missing"
            exit 1
          }

          test -d deploy/node_modules || {
            echo "::error::node_modules missing"
            exit 1
          }

          test -d deploy/.next || {
            echo "::error::.next missing"
            exit 1
          }

          test -d deploy/.next/static || {
            echo "::error::.next/static missing"
            exit 1
          }

          test -d deploy/public || {
            echo "::error::public missing"
            exit 1
          }

          test -f deploy/generated/prisma/client.ts || {
            echo "::error::generated Prisma client missing"
            exit 1
          }

          test -d deploy/node_modules/pg || {
            echo "::error::pg runtime package missing"
            exit 1
          }

          test -d deploy/node_modules/@prisma/adapter-pg || {
            echo "::error::Prisma pg adapter missing"
            exit 1
          }

          test -d deploy/node_modules/@react-pdf/renderer || {
            echo "::error::React PDF runtime package missing"
            exit 1
          }

          if ! find deploy/public/uploads -type f ! -name '.gitkeep' -print -quit | grep -q .; then
            echo "::error::public/uploads contains no deployable assets"
            exit 1
          fi

          if find deploy -name '.env*' -print -quit | grep -q .; then
            echo "::error::.env file found in deployment artifact"
            exit 1
          fi

          echo "Deployment artifact verified"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: monadaty-production
          path: deploy/
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check migration branch
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_admin_delete_migration }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::Run the production migration from the main branch only"
            exit 1
          }

      - name: Check out migration files
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_admin_delete_migration }}
        uses: actions/checkout@v4

      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: monadaty-production
          path: deploy

      - name: Verify downloaded artifact
        run: |
          test -f deploy/server.js || {
            echo "::error::server.js missing after download"
            exit 1
          }

          test -d deploy/.next/static || {
            echo "::error::.next/static missing after download"
            exit 1
          }

          test -d deploy/public || {
            echo "::error::public missing after download"
            exit 1
          }

          test -f deploy/generated/prisma/client.ts || {
            echo "::error::generated Prisma client missing after download"
            exit 1
          }

          test -d deploy/node_modules/pg || {
            echo "::error::pg runtime package missing after download"
            exit 1
          }

          test -d deploy/node_modules/@prisma/adapter-pg || {
            echo "::error::Prisma pg adapter missing after download"
            exit 1
          }

          test -d deploy/node_modules/@react-pdf/renderer || {
            echo "::error::React PDF runtime package missing after download"
            exit 1
          }

          if find deploy -name '.env*' -print -quit | grep -q .; then
            echo "::error::.env file found in downloaded artifact"
            exit 1
          fi

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_EDE91C85784246F0B7EC08FBE9E4383A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0EFD8B8BDF5C478C919156C9993FB4F7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_512A21CFD02A4B24A323A0028DCEFF84 }}

      - name: Set up Node.js for database backup and migration
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_admin_delete_migration }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install PostgreSQL client and project dependencies
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_admin_delete_migration }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          npm ci

      - name: Read the production database connection from Azure
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_admin_delete_migration }}
        env:
          AZURE_WEBAPP_NAME: ${{ env.AZURE_WEBAPP_NAME }}
        run: |
          set -euo pipefail
          resource_group="$(az webapp list --query "[?name=='${AZURE_WEBAPP_NAME}'].resourceGroup | [0]" --output tsv)"
          test -n "$resource_group" && test "$resource_group" != "None" || {
            echo "::error::Could not resolve the Azure Web App resource group"
            exit 1
          }

          database_url="$(az webapp config appsettings list \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "$resource_group" \
            --query "[?name=='DATABASE_URL'].value | [0]" \
            --output tsv)"
          database_ca="$(az webapp config appsettings list \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "$resource_group" \
            --query "[?name=='DATABASE_CA_CERT_BASE64'].value | [0]" \
            --output tsv)"

          test -n "$database_url" && test "$database_url" != "None" || {
            echo "::error::DATABASE_URL is missing from Azure Web App settings"
            exit 1
          }
          test -n "$database_ca" && test "$database_ca" != "None" || {
            echo "::error::DATABASE_CA_CERT_BASE64 is missing from Azure Web App settings"
            exit 1
          }

          echo "::add-mask::$database_url"
          echo "::add-mask::$database_ca"
          {
            printf 'DATABASE_URL=%s\n' "$database_url"
            printf 'DATABASE_CA_CERT_BASE64=%s\n' "$database_ca"
          } >> "$GITHUB_ENV"

      - name: Back up production database before migration
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_admin_delete_migration }}
        env:
          BACKUP_DIR: ${{ runner.temp }}/monadaty-production-backup
        run: npx tsx scripts/backup-db.ts

      - name: Verify production backup archive
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_admin_delete_migration }}
        env:
          BACKUP_DIR: ${{ runner.temp }}/monadaty-production-backup
        run: |
          backup_file="$(find "$BACKUP_DIR" -maxdepth 1 -type f -name 'monadaty-backup-*.sql.gz' -print -quit)"
          test -n "$backup_file" || {
            echo "::error::Production database backup was not created"
            exit 1
          }
          gzip -t "$backup_file"
          entries="$(gzip -dc "$backup_file" | pg_restore --list)"
          for table in admins admin_logs product_history; do
            printf '%s\n' "$entries" | grep -Eq "TABLE DATA public $table " || {
              echo "::error::Backup archive is missing the $table table data"
              exit 1
            }
          done

      - name: Save production backup artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_admin_delete_migration }}
        uses: actions/upload-artifact@v4
        with:
          name: monadaty-production-pre-admin-delete-${{ github.run_id }}
          path: ${{ runner.temp }}/monadaty-production-backup/*.sql.gz
          if-no-files-found: error
          retention-days: 30

      - name: Apply the admin deletion database migration
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_admin_delete_migration }}
        run: npx tsx scripts/apply-admin-delete-migration.ts

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: ./deploy

      - name: Restart application and verify the live release
        shell: bash
        run: |
          set -euo pipefail
          resource_group="$(az webapp list --query "[?name=='${AZURE_WEBAPP_NAME}'].resourceGroup | [0]" --output tsv)"
          test -n "$resource_group" && test "$resource_group" != "None" || {
            echo "::error::Could not resolve the Azure Web App resource group"
            exit 1
          }
          az webapp restart --name "$AZURE_WEBAPP_NAME" --resource-group "$resource_group"

          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --max-time 15 \
              -H 'Cache-Control: no-cache' \
              "https://monadaty.com/?release=${DEPLOYMENT_VERSION}" \
              --output /tmp/monadaty-live-release.html; then
              if grep -Fq "dpl=${DEPLOYMENT_VERSION}" /tmp/monadaty-live-release.html; then
                echo "Live release verified: ${DEPLOYMENT_VERSION}"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::The domain is not serving the newly deployed commit"
          exit 1
