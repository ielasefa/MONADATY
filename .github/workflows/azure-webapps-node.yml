- name: Prepare standalone deployment
  run: |
    rm -rf deploy
    mkdir -p deploy

    cp -a .next/standalone/. deploy/

    mkdir -p deploy/.next
    cp -a .next/static deploy/.next/static

    if [ -d public ]; then
      cp -a public deploy/public
    fi

- name: Verify deployment artifact
  run: |
    test -f deploy/server.js || {
      echo "Error: deploy/server.js missing"
      exit 1
    }

    test -d deploy/.next/static || {
      echo "Error: .next/static missing from deployment artifact"
      exit 1
    }

    test -d deploy/.next/server || {
      echo "Error: .next/server missing from deployment artifact"
      exit 1
    }

    echo "Deployment artifact OK"
    ls -lah deploy
    ls -lah deploy/.next